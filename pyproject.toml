[project]
name = "job-search-helper"
version = "0.1.0"
description = "Local, single-user AI-assisted job discovery and resume tailoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1", "google-genai>=1.0,<2", "apscheduler>=3.10,<4",
  "pymupdf>=1.24,<2", "python-docx>=1.1,<2", "tenacity>=9,<10"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "beautifulsoup4>=4.12"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
