<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chubby Job Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--lilac:#b99ae8;--lilac-dark:#7653a6;--ink:#30283d;--cream:#fbf9ff}body{background:var(--cream);color:var(--ink);font-family:'Nunito',sans-serif}.navbar{background:linear-gradient(100deg,#5b3d7c,#8060ad)!important}.navbar-brand,h1,h2,h3,h4,h5{font-family:'Outfit',sans-serif}.navbar-brand{font-weight:700}.card{border:1px solid #eadff8;border-radius:18px;box-shadow:0 5px 18px rgba(93,64,126,.07)}.btn-primary{background:var(--lilac-dark);border-color:var(--lilac-dark)}.btn-outline-primary{color:var(--lilac-dark);border-color:var(--lilac)}.score-card{background:linear-gradient(135deg,#f1e9ff,#fff)}.cat-note{color:#8e6fba;font-size:1.15rem}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="/">🐱 Chubby Job Board</a><a class="text-white text-decoration-none" href="/settings">Settings</a></div></nav><main class="container py-4">{% block content %}{% endblock %}</main></body></html>
