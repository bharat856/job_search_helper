{% extends "base.html" %}{% block content %}<h1>Settings</h1><form method="post" class="card card-body mb-4"><label>Preferred roles</label><textarea name="preferred_roles" class="form-control mb-2">{{settings.preferred_roles}}</textarea><label>Locations</label><input name="locations" class="form-control mb-2" value="{{settings.locations}}"><label>Languages</label><input name="languages" class="form-control mb-2" value="{{settings.languages}}"><label>Excluded keywords</label><input name="excluded_keywords" class="form-control mb-2" value="{{settings.excluded_keywords}}"><label>Minimum score</label><input name="minimum_score" type="number" class="form-control mb-2" value="{{settings.minimum_score}}"><button class="btn btn-primary">Save</button></form><h2>Resume profile</h2><p class="text-muted">Upload stays local. Review and approve extracted facts before using them for tailoring.</p><form method="post" action="/profile/upload" enctype="multipart/form-data"><input type="file" name="file" accept=".pdf,.docx,.tex" class="form-control mb-2"><button class="btn btn-outline-primary">Upload resume</button></form>{% endblock %}
